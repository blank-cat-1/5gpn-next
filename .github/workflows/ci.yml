name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Race checks and real mihomo forwarding
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --max-time 120 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.29/mihomo-linux-amd64-v1.19.29.gz \
            -o "$RUNNER_TEMP/mihomo.gz"
          echo "60de76a35a6cbf7b4fa4a20f5c257c24345d1d635ab1aa3877022a1997ef413c  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo-test"
          chmod 700 "$RUNNER_TEMP/mihomo-test"
          export MIHOMO_TEST_BINARY="$RUNNER_TEMP/mihomo-test"
          go test -race ./internal/manage ./internal/web ./internal/config ./internal/subscription
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh scripts/build-release.sh scripts/upgrade-preserve-config.sh
      - name: Preserve existing configuration
        run: python3 scripts/test_upgrade_config.py

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build release binaries
        # 用占位 tag 验证脚本：版本注入与 SHA256SUMS 必须同时成功。
        # 正式发布仍由 scripts/build-release.sh <真实 tag> 产出后上传 GitHub Release。
        run: bash scripts/build-release.sh v0.0.0
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: 5gpnd-linux
          path: dist/
          if-no-files-found: error
